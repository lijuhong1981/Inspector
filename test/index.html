<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Inspector 测试页</title>
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
		#canvas-container { position: fixed; inset: 0; }
		#canvas-container canvas { display: block; }
		#hint {
			position: fixed; left: 12px; top: 12px; z-index: 1;
			color: #aaa; font: 12px/1.6 monospace; pointer-events: none;
			background: rgba(0,0,0,.45); padding: 8px 10px; border-radius: 6px;
		}
	</style>

	<!--
		three 通过 importmap 映射到本地 node_modules（当前 0.184.0）。
		若要测试官方配套的 0.186，可改为 CDN：
			"three":        "https://unpkg.com/three@0.186.1/build/three.module.js",
			"three/webgpu": "https://unpkg.com/three@0.186.1/build/three.webgpu.js",
			"three/tsl":    "https://unpkg.com/three@0.186.1/build/three.tsl.js"
	-->
	<script type="importmap">
	{
		"imports": {
			"three":        "../node_modules/three/build/three.module.js",
			"three/webgpu": "../node_modules/three/build/three.webgpu.js",
			"three/tsl":    "../node_modules/three/build/three.tsl.js"
		}
	}
	</script>
</head>
<body>
	<div id="canvas-container"></div>
	<div id="hint">右下角点击 Inspector 开关面板 · 右上角 TSL Graph / Color Grading 请在 Settings 里勾选启用</div>

	<script type="module" src="./main.js"></script>
</body>
</html>
